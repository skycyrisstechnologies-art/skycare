<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify OTP</title>
</head>
<body>

<h2>Enter OTP</h2>

<form th:action="@{/patient/verify-otp}" method="post">
    <input
        type="text"
        name="otp"
        placeholder="Enter OTP"
        required
    />
    <button type="submit">Verify OTP</button>
</form>

</body>
</html>
