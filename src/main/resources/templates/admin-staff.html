<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Manage Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;
  --glass-blue:#bfe6ff;
  --glass-blue-soft:#e8f6ff;
  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;
  --ink:#0a2540;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Segoe UI,system-ui,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  overflow-x:hidden;
  color:var(--ink);
}

/* BACKGROUND DOTS */
#ambient{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:280px;
  background:linear-gradient(180deg,var(--nav-dark),var(--nav-deep));
  border-radius:28px;
  padding:36px 26px;
  color:white;
  z-index:5;
}

.sidebar h2{
  text-align:center;
  margin-bottom:40px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  margin-bottom:12px;
  border-radius:14px;
  color:#d9ecff;
  text-decoration:none;
}

.sidebar a.active,
.sidebar a:hover{
  background:rgba(255,255,255,.18);
}

/* MAIN CONTENT */
.content{
  margin-left:360px;
  padding:50px 60px;
  position:relative;
  z-index:5;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h1{
  font-size:40px;
}

.sub{
  color:#4e7aa0;
  margin-bottom:30px;
}

/* BACK BUTTON */
.back-btn{
  border:none;
  padding:10px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  color:#0a2540;
  cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.65));
  backdrop-filter:blur(18px);
  box-shadow:
    0 14px 36px rgba(11,63,143,.25),
    inset 0 0 0 1px rgba(255,255,255,.7);
  transition:.3s ease;
  text-decoration:none;
}

.back-btn:hover{
  transform:translateY(-2px);
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:20px;
}

.add-btn{
  background:linear-gradient(135deg,#6fd3ff,#3b82c4);
  padding:12px 24px;
  border-radius:16px;
  color:white;
  text-decoration:none;
  font-weight:600;
}

/* PANEL */
.panel{
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(24px);
  border-radius:30px;
  padding:26px;
}

/* GRID */
.grid-head,
.row-card{
  display:grid;
  grid-template-columns:
    1fr
    1.2fr
    1.2fr
    1.2fr
    1fr
    1fr;
  align-items:center;
  column-gap:12px;
}

.grid-head{
  padding:0 12px 12px;
  font-weight:600;
  color:#5c7fa1;
}

.row-card{
  background:white;
  padding:16px 12px;
  border-radius:20px;
  margin-bottom:16px;
  box-shadow:0 14px 30px rgba(0,0,0,.1);
}

/* ACTION BUTTONS */
.actions{
  display:flex;
  gap:10px;
}

.edit{
  background:#4aa8ff;
  color:white;
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  font-size:14px;
}

.delete{
  background:#ff6b6b;
  color:white;
  padding:8px 14px;
  border-radius:12px;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}">🧑‍⚕️ Manage Doctors</a>
  <a class="active">👨‍💼 Manage Staff</a>
  <a th:href="@{/admin/patients}">🧍 Patients</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="header">
    <h1>Manage Staff</h1>
    <a href="/admin/dashboard" class="back-btn">← Back</a>
  </div>

  <div class="sub">Staff registry & access control</div>

  <div class="top-bar">
    <a class="add-btn" th:href="@{/admin/staff/add}">+ Add Staff</a>
  </div>

  <div class="panel">

    <div class="grid-head">
      <div>Code</div>
      <div>Name</div>
      <div>Role</div>
      <div>Department</div>
      <div>Status</div>
      <div>Actions</div>
    </div>

    <div class="row-card" th:each="s : ${staff}">
      <div th:text="${s.staffCode}">STF-001</div>
      <div th:text="${s.name}">Rajesh Kumar</div>
      <div th:text="${s.role}">Nurse</div>
      <div th:text="${s.department}">Emergency</div>
      <div th:text="${s.status}">ACTIVE</div>
      <div class="actions">
        <a class="edit" th:href="@{'/admin/staff/edit/' + ${s.id}}">Edit</a>
        <a class="delete"
           th:href="@{'/admin/staff/delete/' + ${s.id}}"
           onclick="return confirm('Are you sure?')">Delete</a>
      </div>
    </div>

  </div>
</div>

<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;

const dots=[...Array(140)].map(() => ({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2+1,
  v:Math.random()*0.35+0.15
}));

(function animate(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<0)d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle="rgba(143,211,255,0.35)";
    ctx.fill();
  });
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
