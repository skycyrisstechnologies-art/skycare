<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>SkyCare | Patient Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --skycyriss-dark:#08356F;
  --skycyriss-accent:#2F80ED;
  --bg:#f4f7f9;
  --white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI","Inter",system-ui,sans-serif;
}

body{
  background:linear-gradient(135deg,#eaf4ff,#f7fbff);
  min-height:100vh;
}

/* ================= HEADER ================= */
.header{
  background:var(--skycyriss-dark);
  color:white;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  font-size:26px;
  font-weight:700;
}

.header a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* ================= FORM CONTAINER ================= */
.container{
  max-width:900px;
  margin:60px auto;
  background:white;
  border-radius:18px;
  box-shadow:0 40px 120px rgba(8,53,111,.25);
  padding:50px;
}

/* ================= TITLE ================= */
.container h2{
  text-align:center;
  color:var(--skycyriss-dark);
  font-size:30px;
  margin-bottom:10px;
}

.container p{
  text-align:center;
  color:#64748b;
  margin-bottom:40px;
}

/* ================= GRID ================= */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:26px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

label{
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

/* ===== REQUIRED ASTERISK ===== */
.required::after{
  content:" *";
  color:#e11d48;
  font-weight:700;
}

input, select, textarea{
  padding:14px 16px;
  border-radius:10px;
  border:1px solid #dbe3ec;
  font-size:14px;
}

textarea{
  resize:none;
}

/* ================= RADIO ================= */
.radio-group{
  display:flex;
  gap:20px;
  margin-top:8px;
}

.radio-group label{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:500;
}

/* ================= ACTIONS ================= */
.actions{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:40px;
}

.submit-btn{
  background:linear-gradient(135deg,#2F80ED,#5aa9ff);
  border:none;
  color:white;
  padding:14px 36px;
  border-radius:24px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.cancel-btn{
  background:#e5e7eb;
  color:#1f2937;
  padding:14px 36px;
  border-radius:24px;
  text-decoration:none;
  font-weight:600;
}

/* ================= RESPONSIVE ================= */
@media(max-width:800px){
  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <h1>SkyCare Patient Registration</h1>
  <a href="/home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<!-- ================= FORM ================= -->
<div class="container">

  <h2>Patient Registration</h2>
  <p>Please enter patient details carefully</p>

  <form th:action="@{/patient/details}" method="post">

    <div class="form-grid">

      <div class="form-group">
        <label class="required">Full Name</label>
        <input type="text" name="name" required
               oninput="this.value=this.value.replace(/[^a-zA-Z\s]/g,'')">
      </div>

      <div class="form-group">
        <label class="required">Age</label>
        <input type="number" name="age" required>
      </div>

      <div class="form-group">
        <label class="required">Gender</label>
        <select name="gender" required>
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label class="required">Phone</label>
        <input type="number" name="phone" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email">
      </div>

      <div class="form-group">
        <label>Blood Group</label>
        <input type="text" name="bg">
      </div>

      <div class="form-group">
        <label>Purpose of Visit</label>
        <input type="text" name="pov">
      </div>

      <div class="form-group">
        <label class="required">BP / Sugar</label>
        <div class="radio-group">
          <label><input type="radio" name="bp_sugar" value="Yes"> Yes</label>
          <label><input type="radio" name="bp_sugar" value="No"> No</label>
        </div>
      </div>

      <div class="form-group" style="grid-column:span 2">
        <label>Disease / Symptoms</label>
        <textarea rows="4" name="disease"></textarea>
      </div>

    </div>

    <div class="actions">
      <button class="submit-btn" type="submit">Register Patient</button>
      <a href="/home" class="cancel-btn">Cancel</a>
    </div>

  </form>

</div>

<!-- ================= VALIDATION SCRIPT ================= -->
<script>
document.querySelector("form").addEventListener("submit", function(e){

  const name = document.querySelector('input[name="name"]').value.trim();
  const age = document.querySelector('input[name="age"]').value;
  const gender = document.querySelector('select[name="gender"]').value;
  const phone = document.querySelector('input[name="phone"]').value.trim();
  const email = document.querySelector('input[name="email"]').value.trim();
  const bpSugar = document.querySelector('input[name="bp_sugar"]:checked');

  if (!/^[A-Za-z\s]{3,}$/.test(name)) {
    alert("Full Name must contain only alphabets and minimum 3 characters");
    e.preventDefault(); return;
  }

  if (age <= 0 || age > 120) {
    alert("Please enter a valid age (1–120)");
    e.preventDefault(); return;
  }

  if (gender === "") {
    alert("Please select gender");
    e.preventDefault(); return;
  }

  if (!/^\d{10}$/.test(phone)) {
    alert("Phone number must be exactly 10 digits");
    e.preventDefault(); return;
  }

  if (email && !/^\S+@\S+\.\S+$/.test(email)) {
    alert("Please enter a valid email address");
    e.preventDefault(); return;
  }

  if (!bpSugar) {
    alert("Please select BP / Sugar status");
    e.preventDefault(); return;
  }

});
</script>

</body>
</html>
