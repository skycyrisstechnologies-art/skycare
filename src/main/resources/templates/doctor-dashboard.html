<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body{background:#f4f6f9} .sidebar{width:250px;height:100vh;background:#0d6efd;position:fixed;padding:20px;color:#fff} .content{margin-left:270px;padding:25px} </style>
</head>
<body>
<div class="sidebar">
    <h4>Doctor Portal</h4>
    <a th:href="@{/doctor/dashboard}" class="text-white">Dashboard</a>
    <a th:href="@{/doctor/patients}" class="text-white">My Patients</a>
    <a th:href="@{/logout}" class="text-white">Logout</a>
</div>

<div class="content">
    <h2>Welcome, <span th:text="${doctorName}">Doctor</span></h2>

    <div class="row mt-4">
        <div class="col-md-4 card p-3">
            <h6>Total Patients</h6>
            <h3 th:text="${patientCount}">0</h3>
        </div>
        <div class="col-md-4 card p-3">
            <h6>Today's Appointments</h6>
            <h3 th:text="${appointmentCount}">0</h3>
        </div>
        <div class="col-md-4 card p-3">
            <h6>Pending Reports</h6>
            <h3 th:text="${pendingReports}">0</h3>
        </div>
    </div>
</div>
</body>
</html>
