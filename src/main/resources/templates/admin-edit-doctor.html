<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Doctor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;
  --glass-blue:#bfe6ff;
  --glass-blue-soft:#e8f6ff;
  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;
  --ink:#0a2540;
  --stroke:rgba(255,255,255,0.45);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  overflow-x:hidden;
  color:var(--ink);
}

/* BACKGROUND DOTS */
#ambient{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:280px;
  z-index:5;
  background:linear-gradient(180deg,#0f3d7a,#082f5c);
  border-radius:28px;
  padding:36px 26px;
  color:white;
  box-shadow:0 80px 180px rgba(11,53,88,0.55);
}

.sidebar h3{
  text-align:center;
  margin-bottom:40px;
  font-weight:700;
}

.sidebar a{
  display:block;
  text-decoration:none;
  color:#d7ecff;
  padding:16px 20px;
  border-radius:16px;
  margin-bottom:14px;
  transition:.35s;
}

.sidebar a:hover{
  background:rgba(255,255,255,0.18);
  transform:translateX(6px);
}

/* MAIN */
.main{
  position:relative;
  z-index:5;
  margin-left:360px;
  padding:60px 80px;
}

/* FORM CARD */
.form-card{
  max-width:760px;
  margin:auto;
  padding:46px;
  border-radius:34px;
  background:linear-gradient(180deg,var(--glass-blue-soft),var(--glass-blue));
  backdrop-filter: blur(32px);
  box-shadow:
    0 80px 180px rgba(31,79,115,0.45),
    inset 0 0 0 1px var(--stroke);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}

.form-card h2{
  font-size:32px;
  font-weight:700;
}

.subtitle{
  font-size:15px;
  color:#4c6f86;
  margin-bottom:36px;
}

/* BACK BUTTON */
.back-btn{
  border:none;
  padding:10px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  color:#0a2540;
  cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.65));
  backdrop-filter:blur(18px);
  box-shadow:
    0 14px 36px rgba(11,63,143,.25),
    inset 0 0 0 1px rgba(255,255,255,.7);
  transition:.3s ease;
}

.back-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 26px 60px rgba(11,63,143,.35),
    inset 0 0 0 1px rgba(255,255,255,.85);
}

/* INPUTS */
.form-label{
  font-weight:600;
  color:#375b73;
}

.form-control, .form-select{
  border-radius:14px;
  padding:14px 16px;
  border:none;
  box-shadow:0 10px 26px rgba(0,0,0,0.08);
}

/* BUTTONS */
.actions{
  display:flex;
  gap:16px;
  margin-top:30px;
}

.btn-save{
  background:linear-gradient(135deg,#6fd3ff,#3b82c4);
  border:none;
  color:white;
  padding:14px 30px;
  border-radius:16px;
  font-weight:600;
}

.btn-cancel{
  background:rgba(255,255,255,0.65);
  border:none;
  padding:14px 30px;
  border-radius:16px;
  font-weight:600;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .sidebar{display:none;}
  .main{margin-left:0;padding:40px;}
}
.back-btn {
    text-decoration: none;
    color: #0d6efd;
    font-weight: 500;
}

.back-btn:hover {
    text-decoration: none;   /* double-safety */
    color: #084298;
}

</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>Admin Portal</h3>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}" style="background:rgba(255,255,255,0.18)">🧑‍⚕️ Manage Doctors</a>
  <a th:href="@{/admin/staff}">👨‍💼 Manage Staff</a>
  <a th:href="@{/admin/patients}">🧍 Patients</a>
  <a th:href="@{/admin/billing}">💳 Billing</a>
  <a th:href="@{/admin/analytics}">📊 Analytics</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="form-card">

    <div class="header">
      <h2>Edit Doctor</h2>
     <a href="/admin/dashboard" class="back-btn">← Back</a>  
    </div>

    <div class="subtitle">Update doctor profile & access information</div>

    <form th:action="@{'/admin/doctors/update/' + ${doctor.id}}"
          th:object="${doctor}" method="post">

      <input type="hidden" th:field="*{id}">
      <input type="hidden" th:field="*{doctorCode}">

      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input th:field="*{name}" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Specialization</label>
          <input th:field="*{specialization}" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Wing</label>
          <input th:field="*{wing}" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select th:field="*{status}" class="form-select">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input th:field="*{phone}" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input th:field="*{email}" class="form-control">
        </div>
      </div>

      <div class="actions">
        <button class="btn-save">Update Doctor</button>
        <a th:href="@{/admin/doctors}" class="btn-cancel">Cancel</a>
      </div>

    </form>

  </div>

</div>

<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;

const dots=[...Array(140)].map(() => ({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2.6+1.2,
  v:Math.random()*0.35+0.15,
  o:Math.random()*0.35+0.15
}));

function animate(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<-10)d.y=c.height+10;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(143,211,255,${d.o})`;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
    (e.ctrlKey && e.key === "U")
  ) {
    e.preventDefault();
  }
});
</script>
<script>
(function () {
  let navigatedBack = false;

  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      navigator.sendBeacon("/kill-session");
      window.location.replace("/login?expired");
    }
  });

  window.addEventListener("popstate", function () {
    navigatedBack = true;
  });

  window.addEventListener("beforeunload", function () {
    if (navigatedBack) {
      navigator.sendBeacon("/kill-session");
    }
  });
})();
</script>

</body>
</html>
