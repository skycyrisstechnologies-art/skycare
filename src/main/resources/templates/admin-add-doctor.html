<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-primary mb-4">Add Doctor</h2>

    <form th:action="@{/admin/doctors/add}" th:object="${doctor}" method="post">

        <div class="mb-3">
            <label>Name</label>
            <input th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Specialization</label>
            <input th:field="*{specialization}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Wing</label>
            <input th:field="*{wing}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select th:field="*{status}" class="form-control">
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input th:field="*{phone}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input th:field="*{email}" class="form-control">
        </div>

        <button class="btn btn-success">Save</button>
        <a th:href="@{/admin/doctors}" class="btn btn-secondary">Cancel</a>

    </form>
</div>

</body>
</html>
