<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .container-box {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container-box">

    <h2 class="mb-4 text-primary">Add New Patient</h2>

    <form th:action="@{/admin/patients/add}" th:object="${patient}" method="post">

        <div class="mb-3">
            <label>Name</label>
            <input th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input th:field="*{age}" type="number" class="form-control" required>
        </div>

<div class="mb-3">
    <label>Gender</label>
    <select th:field="*{gender}" class="form-control">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
</div>


        <div class="mb-3">
            <label>Phone</label>
            <input th:field="*{phone}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input th:field="*{email}" type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Disease / Symptoms</label>
            <input th:field="*{disease}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Assigned Doctor Code</label>
            <input th:field="*{assignedDoctorCode}" class="form-control" placeholder="Example: DOC-002">
        </div>

        <button class="btn btn-success mt-3">Save Patient</button>
        <a th:href="@{/admin/patients}" class="btn btn-secondary mt-3">Cancel</a>

    </form>

</div>

</body>
</html>
