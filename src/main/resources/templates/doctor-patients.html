<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>My Patients</h2>

    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Disease</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.age}"></td>
            <td th:text="${p.gender}"></td>
            <td th:text="${p.phone}"></td>
            <td th:text="${p.disease}"></td>
            <td>
                <a th:href="@{/doctor/patient/{id}(id=${patient.id})}"
                class="btn btn-primary btn-sm">
                View
                </a>

            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/doctor/dashboard}" class="btn btn-secondary mt-3">
        Back to Dashboard
    </a>

</div>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
    (e.ctrlKey && e.key === "U")
  ) {
    e.preventDefault();
  }
});
</script>


<script>
(function () {
  let navigatedBack = false;

  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      navigator.sendBeacon("/kill-session");
      window.location.replace("/login?expired");
    }
  });

  window.addEventListener("popstate", function () {
    navigatedBack = true;
  });

  window.addEventListener("beforeunload", function () {
    if (navigatedBack) {
      navigator.sendBeacon("/kill-session");
    }
  });
})();
</script>

</body>
</html>
