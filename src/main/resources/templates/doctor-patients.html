<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body{background:#f4f6f9} .sidebar{width:250px;height:100vh;background:#0d6efd;position:fixed;padding:20px;color:#fff} .content{margin-left:270px;padding:25px} </style>
</head>
<body>
<div class="sidebar">
    <h4>Doctor Portal</h4>
    <a th:href="@{/doctor/dashboard}" class="text-white">Dashboard</a>
    <a th:href="@{/doctor/patients}" class="text-white">My Patients</a>
</div>
<div class="content">
    <h2>My Patients</h2>
    <table class="table table-striped">
        <thead>
        <tr><th>Name</th><th>Age</th><th>Phone</th><th>Assigned Doctor</th><th>Action</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.name}">Name</td>
            <td th:text="${p.age}">Age</td>
            <td th:text="${p.phone}">Phone</td>
            <td th:text="${p.assignedDoctorCode}">DOC</td>
            <td><a th:href="@{'/doctor/patient/' + ${p.id}}" class="btn btn-sm btn-primary">View</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
