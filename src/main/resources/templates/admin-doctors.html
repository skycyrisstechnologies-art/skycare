<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .content { padding: 30px; margin-left: 260px; }
        .table { background: white; }
        .sidebar { 
            width: 250px; height: 100vh; background: #0d6efd;
            color: white; padding: 20px; position: fixed; 
        }
        .sidebar a {
            color: white; padding: 10px; display: block; 
            border-radius: 6px; text-decoration: none;
        }
        .sidebar a:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>

<body>

<div class="sidebar">
    <h3 class="text-center">Admin Portal</h3>

    <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/admin/doctors}">🧑‍⚕️ Manage Doctors</a>
    <a th:href="@{/admin/staff}">👨‍💼 Manage Staff</a>
    <a th:href="@{/admin/patients}">🧍 Patients</a>
    <a th:href="@{/admin/billing}">💳 Billing</a>
    <a th:href="@{/admin/analytics}">📊 Analytics</a>
    <a th:href="@{/logout}">🚪 Logout</a>
</div>

<div class="content">

    <h2 class="mb-4">Doctors List</h2>

    <a class="btn btn-success mb-3" th:href="@{/admin/doctors/add}">+ Add Doctor</a>

    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-primary">
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Wing</th>
                <th>Status</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="d : ${doctors}">
                <td th:text="${d.doctorCode}"></td>
                <td th:text="${d.name}"></td>
                <td th:text="${d.specialization}"></td>
                <td th:text="${d.wing}"></td>
                <td th:text="${d.status}"></td>
                <td th:text="${d.phone}"></td>
                <td th:text="${d.email}"></td>

                <td>
                    <a th:href="@{'/admin/doctors/edit/' + ${d.id}}" class="btn btn-sm btn-primary">Edit</a>
                    <a th:href="@{'/admin/doctors/delete/' + ${d.id}}"
                       onclick="return confirm('Are you sure?')"
                       class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
