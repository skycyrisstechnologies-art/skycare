<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Patient</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;
  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;
  --ink:#0a2540;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
}

html, body{
  min-height:100%;
  overflow-y:auto;
}

body{
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  color:var(--ink);
}

#ambient{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:280px;
  background:linear-gradient(180deg,var(--nav-dark),var(--nav-deep));
  border-radius:28px;
  padding:36px 26px;
  color:white;
  z-index:5;
}

.sidebar h2{
  text-align:center;
  margin-bottom:40px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  margin-bottom:14px;
  border-radius:16px;
  color:#d7ecff;
  text-decoration:none;
  font-size:16px;
}

.sidebar a:hover,
.sidebar a.active{
  background:rgba(255,255,255,0.18);
  color:white;
}

/* MAIN */
.main{
  margin-left:360px;
  padding:60px 80px;
  position:relative;
  z-index:5;
}

/* CARD */
.card{
  max-width:720px;
  margin:auto;
  padding:42px;
  border-radius:36px;
  background:rgba(255,255,255,0.65);
  backdrop-filter:blur(30px);
  box-shadow:0 40px 120px rgba(0,0,0,0.15);
}

/* HEADER */
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.card h1{
  font-size:36px;
}

.card p{
  color:#4c6f86;
  margin-bottom:32px;
}

/* BACK BUTTON */
.back-btn{
  border:none;
  padding:10px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  color:#0a2540;
  cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.65));
  backdrop-filter:blur(18px);
  box-shadow:
    0 14px 36px rgba(11,63,143,.25),
    inset 0 0 0 1px rgba(255,255,255,.7);
  transition:.3s ease;
}

.back-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 26px 60px rgba(11,63,143,.35),
    inset 0 0 0 1px rgba(255,255,255,.85);
}

/* FORM */
.form-group{
  margin-bottom:22px;
}

label{
  font-weight:600;
  margin-bottom:6px;
  display:block;
}

input, select{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:none;
  font-size:15px;
  background:white;
  box-shadow:0 10px 24px rgba(0,0,0,0.08);
  outline:none;
}

.actions{
  display:flex;
  gap:16px;
  margin-top:30px;
}

.update{
  background:linear-gradient(135deg,#6fd3ff,#3b82c4);
  color:white;
  padding:14px 26px;
  border-radius:18px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.cancel{
  background:#e0e6ec;
  color:#1b2b3a;
  padding:14px 26px;
  border-radius:18px;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}">🧑‍⚕️ Doctors</a>
  <a class="active">🧍 Patients</a>
  <a th:href="@{/admin/staff}">👨‍💼 Staff</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="card">

    <div class="card-header">
      <h1>Edit Patient</h1>
      <button class="back-btn" onclick="history.back()">← Back</button>
    </div>

    <p>Update patient information and doctor assignment</p>

    <form th:action="@{/admin/patients/update}" th:object="${patient}" method="post">

      <input type="hidden" th:field="*{id}"/>

      <div class="form-group">
        <label>Name</label>
        <input th:field="*{name}" required>
      </div>

      <div class="form-group">
        <label>Age</label>
        <input th:field="*{age}" type="number" required>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select th:field="*{gender}">
          <option value="">Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input th:field="*{phone}">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input th:field="*{email}" type="email">
      </div>

      <div class="form-group">
        <label>Disease / Symptoms</label>
        <input th:field="*{disease}">
      </div>

      <div class="form-group">
        <label>Assigned Doctor Code</label>
        <input th:field="*{assignedDoctorCode}">
      </div>

      <div class="actions">
        <button class="update">Update Patient</button>
        <a class="cancel" th:href="@{/admin/patients}">Cancel</a>
      </div>

    </form>
  </div>

</div>

<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();window.addEventListener("resize",resize);

const dots=[...Array(140)].map(() => ({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2.5+1,
  v:Math.random()*0.4+0.1,
  o:Math.random()*0.4+0.15
}));

(function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<0) d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(140,210,255,${d.o})`;
    ctx.fill();
  });
  requestAnimationFrame(anim);
})();
</script>


<script>
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
    (e.ctrlKey && e.key === "U")
  ) {
    e.preventDefault();
  }
});
</script>


</body>
</html>
