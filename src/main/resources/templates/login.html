<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Health Intelligence Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --sky:#cfefff;
  --light:#8fd3ff;
  --mid:#3f93c7;
  --deep:#1f4f73;
  --brand:#0f5299;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
}

body{
  height:100vh;
  background:
    radial-gradient(circle at 50% 38%,
      #ffffff 0%,
      var(--sky) 25%,
      var(--light) 45%,
      var(--mid) 70%,
      var(--deep) 100%);
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CANVAS LAYERS */
canvas{
  position:absolute;
  inset:0;
}

/* LOGIN CARD */
.login{
  position:relative;
  z-index:10;
  width:380px;              /* ✅ CHANGED */
  padding:30px 42px;        /* ✅ CHANGED */
  border-radius:28px;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,0.46),
      rgba(255,255,255,0.026));
  backdrop-filter: blur(30px);
  box-shadow:
    0 60px 140px rgba(31,79,115,0.42),
    inset 0 0 0 1px rgba(255,255,255,0.30);
  text-align:center;
}

/* ✨ BRAND NAME ✨ */
.brand{
  font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
  font-size:48px;
  font-weight:600;
  letter-spacing:1px;
  color:#0f5299;
  margin-bottom:8px;
  text-shadow:0 6px 18px rgba(15,82,153,0.35);
}

/* TITLE */
.login h2{
  font-size:32px;
  font-weight:700;
  color:#0b2a3d;
}

/* SUBTITLE */
.subtitle{
  font-size:15px;
  color:#355e78;
  margin-top:12px;
  margin-bottom:24px;
}

/* INPUTS */
.login input{
  width:100%;
  padding:16px;
  margin:14px 0;
  border-radius:14px;
  border:none;
  background:white;
  font-size:15px;
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}

.login input:focus{
  outline:none;
  box-shadow:0 0 0 2px rgba(63,147,199,0.45);
}

/* BUTTON */
.login button{
  width:100%;
  padding:17px;
  margin-top:26px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#5fd4ff,#2b6fa3);
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 22px 46px rgba(47,111,163,0.55);
}

.login button:hover{
  transform:translateY(-2px);
}

/* ERROR */
.error{
  margin-top:14px;
  color:#d9534f;
  font-size:14px;
  font-weight:600;
}

/* FOOTER */
.footer-text{
  margin-top:28px;
  font-size:13px;
  color:#5a7f95;
  opacity:0.85;
}
.footer-text a{
  color: inherit;
  text-decoration: none;
  font-weight: 500;
}

.footer-text a:hover{
  text-decoration: underline;
}

</style>
</head>

<body>

<canvas id="dna"></canvas>
<canvas id="network"></canvas>
<canvas id="icons"></canvas>

<div class="login">

  <div class="brand">SkyCare</div>

  <h2 th:if="${role == 'ADMIN'}">Welcome Admin</h2>
  <h2 th:if="${role == 'DOCTOR'}">Welcome Doctor</h2>
  <h2 th:if="${role == 'STAFF'}">Welcome Staff</h2>
  <h2 th:if="${role == null}">LOGIN</h2>

  <p class="subtitle" th:if="${role != null}">
    Please login to continue
  </p>
  <p class="subtitle" th:if="${role == null}">
    Welcome back, Please login.
  </p>

  <form th:action="@{/login}" method="post">

    <input type="hidden" name="role" th:value="${role}" />

   

    <input type="text" name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />

    <button type="submit">Login</button>

    <div th:if="${param.error}" class="error">
      Invalid username or password
    </div>
  </form>

  <div class="footer-text">
  © Powered by 
  <a href="https://skycyriss.com/" target="_blank" rel="noopener noreferrer">
    SkyCyriss
  </a>
</div>

</div>

<script>
/* DNA HELIX */
const dna=document.getElementById("dna");
const d=dna.getContext("2d");
dna.width=innerWidth; dna.height=innerHeight;
let t=0;

function drawDNA(){
  d.clearRect(0,0,dna.width,dna.height);
  const cx=dna.width/2, cy=dna.height/2, r=160;

  for(let y=-dna.height/2;y<dna.height/2;y+=10){
    const a=t+y*0.03;
    const x=Math.sin(a)*r;
    const z=(Math.cos(a)+1)/2;

    d.strokeStyle=`rgba(143,211,255,${0.18+z*0.35})`;
    d.lineWidth=2+z*3;
    d.beginPath();
    d.moveTo(cx-x,cy+y);
    d.lineTo(cx+x,cy+y);
    d.stroke();

    d.beginPath();
    d.arc(cx+x,cy+y,4+z*4,0,Math.PI*2);
    d.fillStyle=`rgba(15,82,153,${0.55+z*0.35})`;
    d.fill();
  }
  t+=0.015;
  requestAnimationFrame(drawDNA);
}
drawDNA();

/* NETWORK */
const net=document.getElementById("network");
const n=net.getContext("2d");
net.width=innerWidth; net.height=innerHeight;

const nodes=[...Array(100)].map(()=>( {
  x:Math.random()*net.width,
  y:Math.random()*net.height,
  vx:(Math.random()-0.5)*0.25,
  vy:(Math.random()-0.5)*0.25
}));

function drawNetwork(){
  n.clearRect(0,0,net.width,net.height);
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    a.x+=a.vx; a.y+=a.vy;
    if(a.x<0||a.x>net.width) a.vx*=-1;
    if(a.y<0||a.y>net.height) a.vy*=-1;

    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      const dist=Math.hypot(a.x-b.x,a.y-b.y);
      if(dist<160){
        n.strokeStyle=`rgba(15,82,153,${0.6-dist/160})`;
        n.lineWidth=0.6;
        n.beginPath();
        n.moveTo(a.x,a.y);
        n.lineTo(b.x,b.y);
        n.stroke();
      }
    }
  }
  requestAnimationFrame(drawNetwork);
}
drawNetwork();

/* MEDICAL ICONS */
const icon=document.getElementById("icons");
const ic=icon.getContext("2d");
icon.width=innerWidth; icon.height=innerHeight;

const items=[...Array(28)].map(()=>( {
  x:Math.random()*icon.width,
  y:Math.random()*icon.height,
  s:Math.random()*18+22,
  v:Math.random()*0.18+0.08,
  type:Math.floor(Math.random()*2)
}));

function drawMedicalCross(x,y,s){
  ic.fillStyle="rgba(15,82,153,0.32)";
  ic.fillRect(x-s/2,y-s/6,s,s/3);
  ic.fillRect(x-s/6,y-s/2,s/3,s);
}

function drawMedicalHeart(x,y,s){
  const size=s*1.45;
  ic.fillStyle="rgba(15,82,153,0.32)";
  ic.beginPath();
  ic.moveTo(x,y+size*0.55);
  ic.bezierCurveTo(x-size,y+size*0.1,x-size*0.7,y-size,x,y-size*0.35);
  ic.bezierCurveTo(x+size*0.7,y-size,x+size,y+size*0.1,x,y+size*0.55);
  ic.closePath();
  ic.fill();

  ic.fillStyle="rgba(255,255,255,0.85)";
  const p=size*0.28;
  ic.fillRect(x-p/6,y-p/2,p/3,p);
  ic.fillRect(x-p/2,y-p/6,p,p/3);
}

function drawIcons(){
  ic.clearRect(0,0,icon.width,icon.height);
  items.forEach(o=>{
    o.y-=o.v;
    if(o.y<-60) o.y=icon.height+60;
    o.type===0
      ? drawMedicalCross(o.x,o.y,o.s)
      : drawMedicalHeart(o.x,o.y,o.s/2);
  });
  requestAnimationFrame(drawIcons);
}
drawIcons();

/* RESIZE */
onresize=()=>{
  dna.width=network.width=icon.width=innerWidth;
  dna.height=network.height=icon.height=innerHeight;
};
</script>

<script>
(function () {
  if (window.history && window.history.pushState) {
    window.history.pushState(null, null, window.location.href);
    window.addEventListener("popstate", function () {
      window.location.replace("/");
    });
  }
})();
</script>





</body>
</html>
