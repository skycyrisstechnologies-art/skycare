<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f9cbf, #004c70);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* animated glowing circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(40px);
            animation: float 6s infinite alternate ease-in-out;
        }

        .c1 { width: 250px; height: 250px; top: 10%; left: 10%; }
        .c2 { width: 300px; height: 300px; bottom: 15%; right: 12%; }

        @keyframes float {
            from { transform: translateY(0px); }
            to   { transform: translateY(40px); }
        }

        .card {
            width: 380px;
            padding: 40px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #ffffff;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: popUp 0.7s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .logo {
            width: 70px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            font-size: 14px;
            opacity: 0.85;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 15px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(90deg, #22d3ee, #0ea5e9);
            border: none;
            border-radius: 10px;
            font-size: 17px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 6px 14px rgba(14, 165, 233, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.6);
        }

        .error {
            margin-top: 12px;
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
        }

        /* Add bottom hospital tagline */
        .tag {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.8;
        }

    </style>
</head>

<body>

    <!-- glowing circle background -->
    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="card">

        <!-- hospital logo -->
        <img class="logo" src="https://cdn-icons-png.flaticon.com/512/1488/1488589.png" alt="Hospital Logo">

        <h2>Hospital Login</h2>

        <form th:action="@{/login}" method="post">

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" />
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" />
            </div>

            <button type="submit">Login</button>

            <div th:if="${param.error}" class="error">
                Invalid username or password
            </div>

        </form>

        <div class="tag">© 2025 Built by Skycyriss</div>

    </div>

</body>
</html>
