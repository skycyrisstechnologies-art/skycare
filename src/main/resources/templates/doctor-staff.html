<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Hospital Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
  --bg1:#e9f6ff;
  --bg2:#9fd0f3;
  --deep:#1f4f73;
  --ink:#0b2a3d;
  --glass:rgba(255,255,255,.65);
  --stroke:rgba(255,255,255,.45);
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
html,body{height:100%;overflow:hidden}

body{
  background:radial-gradient(circle at 50% 35%,#fff 0%,var(--bg1) 35%,var(--bg2) 70%,var(--deep) 100%);
  color:var(--ink);
}

/* ANIMATION */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:30px;left:30px;bottom:30px;
  width:280px;
  background:linear-gradient(180deg,#0b4fa3,#083b6f);
  border-radius:26px;
  padding:36px 26px;
  color:white;
  z-index:2;
}

.sidebar h2{margin-bottom:40px}

.nav{display:flex;flex-direction:column;gap:16px}

.nav a{
  text-decoration:none;
  color:#d7ecff;
  padding:16px 20px;
  border-radius:16px;
  display:flex;
  gap:14px;
}

.nav a.active,.nav a:hover{
  background:rgba(255,255,255,.18);
}

/* MAIN */
.main{
  position:absolute;
  top:30px;left:340px;right:30px;bottom:30px;
  padding:40px;
  z-index:1;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.header h1{font-size:36px}
.header span{color:#4c6f86}

.back-btn{
  padding:10px 22px;
  border-radius:16px;
  border:none;
  background:white;
  font-weight:600;
  cursor:pointer;
}

/* PANEL */
.panel{
  height:calc(100% - 90px);
  padding:26px;
  border-radius:34px;
  background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.35));
  backdrop-filter:blur(28px);
  box-shadow:0 80px 160px rgba(31,79,115,.35),
             inset 0 0 0 1px var(--stroke);
  overflow:hidden;
}

/* ✅ GRID — FIXED */
.grid{
  display:grid;
  grid-template-columns:
    minmax(90px,1fr)    /* Code */
    minmax(140px,2fr)  /* Name */
    minmax(120px,1.5fr)/* Role */
    minmax(150px,2fr)  /* Department */
    minmax(110px,1fr); /* Status */
  align-items:center;
  width:100%;
}

/* HEADER */
.grid-header{
  padding:14px 20px;
  font-weight:600;
  color:#5c7d94;
}

/* ROW */
.grid-row{
  width:100%;
  background:white;
  padding:18px 20px;
  margin-top:16px;
  border-radius:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
}

/* TEXT SAFETY */
.grid > div{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* STATUS */
/* STATUS COLUMN FIX */
.status{
  display:flex;
  align-items:center;
  justify-content:center;   /* 👈 centers under header */
  font-weight:700;
}


.active{color:#1a7f37}
.inactive{color:#b02a37}
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Doctor Portal</h2>
  <div class="nav">
    <a th:href="@{/doctor/dashboard}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a class="active">
      <i class="bi bi-person-badge"></i> Staff
    </a>
    <a th:href="@{/logout}">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div>
      <h1>Hospital Staff</h1>
      <span>View-only access</span>
    </div>
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <div class="panel">

    <!-- HEADER -->
    <div class="grid grid-header">
      <div>Code</div>
      <div>Name</div>
      <div>Role</div>
      <div>Department</div>
      <div>Status</div>
    </div>

    <!-- ROWS -->
    <div class="grid grid-row" th:each="s : ${staff}">
      <div th:text="${s.staffCode}">STF-1</div>
      <div th:text="${s.name}">Name</div>
      <div th:text="${s.role}">Role</div>
      <div th:text="${s.department}">Dept</div>

      <!-- 🔥 THIS IS ACTIVE / INACTIVE -->
      <div class="status"
           th:text="${s.status}"
           th:classappend="${s.status=='ACTIVE'} ? ' active' : ' inactive'">
        ACTIVE
      </div>
    </div>

  </div>
</div>

<!-- 🌌 BACKGROUND ANIMATION -->
<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const dots=[...Array(120)].map(()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  v:Math.random()*0.4+0.1
}));
(function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<0)d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,2.2,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.35)";
    ctx.fill();
  });
  requestAnimationFrame(anim);
})();
</script>

</body>
</html>
