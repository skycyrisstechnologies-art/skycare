<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Patients</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;
  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;
  --ink:#0a2540;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Segoe UI,system-ui,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  color:var(--ink);
  overflow-x:hidden;
}

/* ===== BACKGROUND ANIMATION ===== */
#ambient{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:260px;
  background:linear-gradient(180deg,var(--nav-dark),var(--nav-deep));
  border-radius:26px;
  padding:32px 22px;
  color:white;
  z-index:5;
}

.sidebar h2{
  text-align:center;
  margin-bottom:36px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  margin-bottom:12px;
  border-radius:14px;
  color:#d9ecff;
  text-decoration:none;
}

.sidebar a.active,
.sidebar a:hover{
  background:rgba(255,255,255,.18);
}

/* ===== MAIN ===== */
.main{
  margin-left:320px;
  padding:60px 80px;
  position:relative;
  z-index:5;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.header h1{
  font-size:42px;
}

.header span{
  color:#4c6f86;
}

/* HEADER ACTIONS */
.header-actions{
  display:flex;
  gap:20px;
}

.btn{
  padding:12px 22px;
  border-radius:18px;
  border:none;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
}

.btn.white{ background:white; color:#0a2540; }
.btn.blue{
  background:linear-gradient(135deg,#6fd3ff,#3b82c4);
  color:white;
}

/* SEARCH */
#filterBox{
  display:none;
  margin:20px 0;
}

#filterInput{
  width:100%;
  padding:14px 18px;
  border-radius:18px;
  border:none;
  font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* ===== PANEL ===== */
.panel{
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(26px);
  border-radius:36px;
  padding:34px;
}

/* ===== GRID ===== */
.grid-header,
.grid-row{
  display:grid;
  grid-template-columns:
    2fr
    0.6fr
    0.8fr
    1.2fr
    1fr
    1fr
    200px; /* ACTIONS FIXED */
  align-items:center;
  column-gap:16px;
}

.grid-header{
  padding:0 20px 16px;
  font-weight:600;
  color:#5c7d94;
}

.grid-row{
  background:white;
  border-radius:24px;
  padding:22px 20px;
  margin-bottom:18px;
  box-shadow:0 14px 30px rgba(0,0,0,.12);
}

/* ACTIONS */
.actions{
  display:flex;
  gap:12px;
  justify-content:flex-end;
}

.actions a{
  min-width:84px;
  padding:10px 0;
  text-align:center;
  border-radius:16px;
  font-weight:600;
  color:white;
  text-decoration:none;
}

.edit{ background:#4fc3ff; }
.delete{ background:#ff5c5c; }
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}">🧑‍⚕️ Doctors</a>
  <a class="active">🧍 Patients</a>
  <a th:href="@{/admin/staff}">👨‍💼 Staff</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div>
      <h1>Patients</h1>
      <span>Patient registry & assignments</span>
    </div>
    <div class="header-actions">
      <a href="/admin/dashboard" class="btn white">← Back</a>
      <button class="btn white" onclick="toggleFilter()">🔍 Search</button>
      <a th:href="@{/admin/patients/add}" class="btn blue">+ Add Patient</a>
    </div>
  </div>

  <div id="filterBox">
    <input id="filterInput" placeholder="Search..." onkeyup="filterPatients()">
  </div>

  <div class="panel">

    <div class="grid-header">
      <div>Name</div>
      <div>Age</div>
      <div>Gender</div>
      <div>Disease</div>
      <div>Doctor</div>
      <div>Date</div>
      <div>Actions</div>
    </div>

    <div class="grid-row" th:each="p : ${patients}">
      <div th:text="${p.name}"></div>
      <div th:text="${p.age}"></div>
      <div th:text="${p.gender}"></div>
      <div th:text="${p.disease}"></div>
      <div th:text="${p.assignedDoctorCode}"></div>
      <div th:text="${#temporals.format(p.createdDate,'dd-MM-yyyy')}"></div>
      <div class="actions">
        <a class="edit" th:href="@{'/admin/patients/edit/' + ${p.id}}">Edit</a>
        <a class="delete"
           th:href="@{'/admin/patients/delete/' + ${p.id}}"
           onclick="return confirm('Delete patient?')">Delete</a>
      </div>
    </div>

  </div>
</div>

<!-- ===== BACKGROUND DOTS JS ===== -->
<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();window.addEventListener("resize",resize);

const dots=[...Array(140)].map(()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2.5+1,
  v:Math.random()*0.4+0.1,
  o:Math.random()*0.4+0.15
}));

(function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<0)d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(140,210,255,${d.o})`;
    ctx.fill();
  });
  requestAnimationFrame(anim);
})();
</script>

<!-- ===== SEARCH JS ===== -->
<script>
function toggleFilter(){
  const f=document.getElementById("filterBox");
  f.style.display=f.style.display==="block"?"none":"block";
}
function filterPatients(){
  const v=document.getElementById("filterInput").value.toLowerCase();
  document.querySelectorAll(".grid-row").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(v)?"grid":"none";
  });
}
</script>
<script>
(function () {
  // Prevent back navigation to login
  if (window.history && window.history.pushState) {
    window.history.pushState(null, null, window.location.href);
    window.addEventListener("popstate", function () {
      window.location.replace("/");
    });
  }
})();
</script>
<script>
/* ===== SORT PATIENTS BY DATE (ASCENDING) ===== */
(function sortPatientsByDateAsc(){
  const panel = document.querySelector(".panel");
  const rows = Array.from(panel.querySelectorAll(".grid-row"));

  rows.sort((a, b) => {
    const dateA = a.children[5].innerText.split("-").reverse().join("-");
    const dateB = b.children[5].innerText.split("-").reverse().join("-");
    return new Date(dateA) - new Date(dateB);
  });

  rows.forEach(row => panel.appendChild(row));
})();
</script>


</body>
</html>
