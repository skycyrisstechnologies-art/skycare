<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Patients</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;
  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;
  --ink:#0a2540;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  color:var(--ink);
}

/* BACKGROUND ANIMATION */
#ambient{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:280px;
  background:linear-gradient(180deg,var(--nav-dark),var(--nav-deep));
  border-radius:28px;
  padding:36px 26px;
  color:white;
  z-index:5;
}

.sidebar h2{
  text-align:center;
  margin-bottom:40px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  margin-bottom:14px;
  border-radius:16px;
  color:#d7ecff;
  text-decoration:none;
  font-size:16px;
}

.sidebar a.active,
.sidebar a:hover{
  background:rgba(255,255,255,0.18);
  color:white;
}

/* MAIN */
.main{
  margin-left:360px;
  padding:55px 80px;
  position:relative;
  z-index:5;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.header h1{
  font-size:42px;
}

.header span{
  color:#4c6f86;
}

/* ACTION BUTTONS */
.header-actions{
  display:flex;
  gap:14px;
}

.action-btn{
  padding:12px 22px;
  border-radius:18px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.back{ background:#fff; }
.filter{ background:#fff; }
.add{ background:linear-gradient(135deg,#6fd3ff,#3b82c4); color:white; }

/* FILTER INPUT */
#filterBox{
  display:none;
  margin-bottom:20px;
}

#filterInput{
  width:100%;
  padding:14px 18px;
  border-radius:18px;
  border:none;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  font-size:15px;
}

/* PANEL */
.panel{
  padding:40px;
  border-radius:36px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(30px);
}

/* GRID — FIXED ALIGNMENT */
.grid-header,
.grid-row{
  display:grid;
  grid-template-columns:
    1.6fr   /* Name */
    0.6fr   /* Age */
    0.8fr   /* Gender */
    1.4fr   /* Phone */
    1.2fr   /* Disease */
    1fr     /* Doctor */
    1fr     /* Date */
    1.2fr;  /* Actions */
  align-items:center;
  gap:16px;
}

.grid-header{
  padding:0 20px 18px;
  font-weight:600;
  color:#5c7d94;
}

.grid-row{
  background:white;
  border-radius:26px;
  padding:22px 20px;
  margin-bottom:20px;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
}

.edit{
  background:#4fc3ff;
  color:white;
  padding:10px 18px;
  border-radius:16px;
  text-decoration:none;
  font-weight:600;
}

.delete{
  background:#ff5c5c;
  color:white;
  padding:10px 18px;
  border-radius:16px;
  text-decoration:none;
  font-weight:600;
}
/*BACK BUTTON */
.back-btn{
  border:none;
  padding:10px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:600;
  color:#0a2540;
  cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.65));
  backdrop-filter:blur(18px);
  box-shadow:
    0 14px 36px rgba(11,63,143,.25),
    inset 0 0 0 1px rgba(255,255,255,.7);
  transition:.3s ease;
}

.back-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 26px 60px rgba(11,63,143,.35),
    inset 0 0 0 1px rgba(255,255,255,.85);
}

.back-btn {
    text-decoration: none;
    color: #0d6efd;
    font-weight: 500;
}

.back-btn:hover {
    text-decoration: none;   /* double-safety */
    color: #084298;
}
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}">🧑‍⚕️ Doctors</a>
  <a class="active">🧍 Patients</a>
  <a th:href="@{/admin/staff}">👨‍💼 Staff</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div>
      <h1>Patients</h1>
      <span>Patient registry & assignments</span>
    </div>

    <div class="header-actions">
      <a href="/admin/dashboard" class="back-btn">← Back</a>
      <button class="action-btn filter" onclick="toggleFilter()">🔍 Filter</button>
      <a class="action-btn add" th:href="@{/admin/patients/add}">+ Add Patient</a>
    </div>
  </div>

  <!-- FILTER -->
  <div id="filterBox">
    <input id="filterInput" placeholder="Filter by anything..." onkeyup="filterPatients()"/>
  </div>

  <div class="panel">

    <div class="grid-header">
      <div>Name</div><div>Age</div><div>Gender</div><div>Phone</div>
      <div>Disease</div><div>Doctor</div><div>Date</div><div></div>
    </div>

    <div class="grid-row" th:each="p : ${patients}">
      <div th:text="${p.name}"></div>
      <div th:text="${p.age}"></div>
      <div th:text="${p.gender}"></div>
      <div th:text="${p.phone}"></div>
      <div th:text="${p.disease}"></div>
      <div th:text="${p.assignedDoctorCode}"></div>
      <div th:text="${#temporals.format(p.createdDate,'dd-MM-yyyy')}"></div>
      <div class="actions">
        <a class="edit" th:href="@{'/admin/patients/edit/' + ${p.id}}">Edit</a>
        <a class="delete" th:href="@{'/admin/patients/delete/' + ${p.id}}"
           onclick="return confirm('Delete patient?')">Delete</a>
      </div>
    </div>

  </div>
</div>

<!-- ANIMATION (UNCHANGED) -->
<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();window.addEventListener("resize",resize);

const dots=[...Array(140)].map(()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2.5+1,
  v:Math.random()*0.4+0.1,
  o:Math.random()*0.4+0.15
}));

(function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v; if(d.y<0)d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(140,210,255,${d.o})`;
    ctx.fill();
  });
  requestAnimationFrame(anim);
})();
</script>

<!-- FILTER SCRIPT -->
<script>
function toggleFilter(){
  const f=document.getElementById("filterBox");
  f.style.display=f.style.display==="block"?"none":"block";
}
function filterPatients(){
  const v=document.getElementById("filterInput").value.toLowerCase();
  document.querySelectorAll(".grid-row").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(v)?"grid":"none";
  });
}
</script>

<script>
(function () {
  let navigatedBack = false;

  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      navigator.sendBeacon("/kill-session");
      window.location.replace("/login?expired");
    }
  });

  window.addEventListener("popstate", function () {
    navigatedBack = true;
  });

  window.addEventListener("beforeunload", function () {
    if (navigatedBack) {
      navigator.sendBeacon("/kill-session");
    }
  });
})();
</script>

</body>
</html>
