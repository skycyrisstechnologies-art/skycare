<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Patient Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .sidebar {
            width: 250px;
            height: 100vh;
            background: #0d6efd;
            position: fixed;
            padding: 20px;
            color: white;
        }

        .sidebar a {
            color: white;
            padding: 10px;
            display: block;
            margin-bottom: 8px;
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }

        .content {
            margin-left: 270px;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h3 class="text-center">Admin Portal</h3>

    <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
    <a th:href="@{/admin/doctors}">🧑‍⚕️ Doctors</a>
    <a th:href="@{/admin/patients}">🧍 Patients</a>
    <a th:href="@{/admin/staff}">👨‍💼 Staff</a>
    <a th:href="@{/logout}">🚪 Logout</a>
</div>

<div class="content">

    <h2 class="mb-4">Patients List</h2>

    <a th:href="@{/admin/patients/add}" class="btn btn-success mb-3">+ Add Patient</a>

    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Disease</th>
                <th>Assigned Doctor</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="p : ${patients}">
                <td th:text="${p.name}"></td>
                <td th:text="${p.age}"></td>
                <td th:text="${p.gender}"></td>
                <td th:text="${p.phone}"></td>
                <td th:text="${p.disease}"></td>
                <td th:text="${p.assignedDoctorCode}"></td>

                <td>
                    <a th:href="@{'/admin/patients/edit/' + ${p.id}}"
                       class="btn btn-sm btn-primary">Edit</a>

                    <a th:href="@{'/admin/patients/delete/' + ${p.id}}"
                       onclick="return confirm('Are you sure you want to delete this patient?')"
                       class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
