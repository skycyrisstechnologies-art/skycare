<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Patients</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
/* ================= ROOT ================= */
:root{
  --nav-dark:#0b3f8f;
  --nav-deep:#072f66;

  --bg1:#f7fbff;
  --bg2:#d6ecfb;
  --bg3:#a8d6f5;

  --ink:#0a2540;
}

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
}

/* ✅ SCROLL FIX */
html, body{
  height:100%;
  overflow-y:auto;
}

/* ================= BODY ================= */
body{
  background:
    radial-gradient(circle at 50% 35%,
      #ffffff 0%,
      var(--bg1) 30%,
      var(--bg2) 55%,
      var(--bg3) 100%);
  color:var(--ink);
}

/* ================= DOTS ================= */
#ambient{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* ================= SIDEBAR ================= */
.sidebar{
  position:fixed;
  top:30px;
  left:30px;
  bottom:30px;
  width:280px;
  background:linear-gradient(180deg,var(--nav-dark),var(--nav-deep));
  border-radius:28px;
  padding:36px 26px;
  color:white;
  z-index:5;
}

.sidebar h2{
  text-align:center;
  margin-bottom:40px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  margin-bottom:14px;
  border-radius:16px;
  color:#d7ecff;
  text-decoration:none;
  font-size:16px;
}

.sidebar a.active,
.sidebar a:hover{
  background:rgba(255,255,255,0.18);
  color:white;
}

/* ================= MAIN ================= */
.main{
  margin-left:360px;
  padding:55px 80px;
  position:relative;
  z-index:5;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.header h1{
  font-size:42px;
}

.header span{
  font-size:15px;
  color:#4c6f86;
}

.add-btn{
  background:linear-gradient(135deg,#6fd3ff,#3b82c4);
  color:white;
  padding:14px 26px;
  border-radius:20px;
  text-decoration:none;
  font-weight:600;
}

/* ================= PANEL ================= */
.panel{
  padding:36px;
  border-radius:36px;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(30px);
}

/* ================= GRID TABLE ================= */
.grid-header,
.grid-row{
  display:grid;
  grid-template-columns:
    1.2fr
    0.6fr
    0.9fr
    1.4fr
    1.2fr
    1fr
    1.3fr;
  align-items:center;
  column-gap:18px;
}

.grid-header{
  padding:0 22px 16px;
  font-weight:600;
  color:#5c7d94;
}

.grid-row{
  background:white;
  border-radius:22px;
  padding:18px 22px;
  margin-bottom:16px;
  box-shadow:0 16px 40px rgba(0,0,0,0.1);
}

/* ================= ACTIONS ================= */
.actions{
  display:flex;
  gap:10px;
}

.edit{
  background:#4fc3ff;
  color:white;
  padding:8px 16px;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
}

.delete{
  background:#ff5c5c;
  color:white;
  padding:8px 16px;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<canvas id="ambient"></canvas>

<!-- SIDEBAR (✅ COLORED EMOJIS RESTORED) -->
<div class="sidebar">
  <h2>Admin Portal</h2>
  <a th:href="@{/admin/dashboard}">🏠 Dashboard</a>
  <a th:href="@{/admin/doctors}">🧑‍⚕️ Doctors</a>
  <a class="active">🧍 Patients</a>
  <a th:href="@{/admin/staff}">👨‍💼 Staff</a>
  <a th:href="@{/logout}">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div>
      <h1>Patients</h1>
      <span>Patient registry & assignments</span>
    </div>
    <a class="add-btn" th:href="@{/admin/patients/add}">+ Add Patient</a>
  </div>

  <div class="panel">

    <div class="grid-header">
      <div>Name</div>
      <div>Age</div>
      <div>Gender</div>
      <div>Phone</div>
      <div>Disease</div>
      <div>Assigned Doctor</div>
      <div></div>
    </div>

    <div class="grid-row" th:each="p : ${patients}">
      <div th:text="${p.name}">Name</div>
      <div th:text="${p.age}">Age</div>
      <div th:text="${p.gender}">Gender</div>
      <div th:text="${p.phone}">Phone</div>
      <div th:text="${p.disease}">Disease</div>
      <div th:text="${p.assignedDoctorCode}">DOC</div>
      <div class="actions">
        <a class="edit" th:href="@{'/admin/patients/edit/' + ${p.id}}">Edit</a>
        <a class="delete"
           th:href="@{'/admin/patients/delete/' + ${p.id}}"
           onclick="return confirm('Delete patient?')">Delete</a>
      </div>
    </div>

  </div>
</div>

<!-- DOT ANIMATION -->
<script>
const c=document.getElementById("ambient"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();window.addEventListener("resize",resize);

const dots=[...Array(140)].map(()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*2.5+1,
  v:Math.random()*0.4+0.1,
  o:Math.random()*0.4+0.15
}));

(function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  dots.forEach(d=>{
    d.y-=d.v;
    if(d.y<0) d.y=c.height;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(140,210,255,${d.o})`;
    ctx.fill();
  });
  requestAnimationFrame(anim);
})();
</script>

</body>
</html>
